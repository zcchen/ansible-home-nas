[defaults]
host_key_checking = False   # skip ssh key checking
# use mitogen_linear to let script execute faster
strategy_plugins = /usr/lib/python3/dist-packages/ansible_mitogen/plugins/strategy
strategy = mitogen_linear
# NOTE: keep watching: https://github.com/mitogen-hq/mitogen/issues/1278

[ssh_connection]
pipelining = True
