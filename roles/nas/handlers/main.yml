---

- name: pull images
  timeout: 600
  register: pull_result
  until: "pull_result.failed == false"
  retries: 5
  delay: 10
  community.docker.docker_image:
    name: "{{ item.value }}"
    source: pull
  with_dict: "{{ nas__images }}"

- name: build images
  timeout: 600
  register: build_result
  until: "build_result.rc == 0"
  retries: 5
  delay: 10
  ansible.builtin.shell:
    cmd: ./docker-compose.sh build
    chdir: "{{ nas__dir_base }}"
    executable: /bin/bash

- name: reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart nas
  become: true
  ansible.builtin.systemd:
    name: nas
    state: restarted

